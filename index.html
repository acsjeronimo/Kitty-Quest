<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitty Quest — Play · Learn · Grow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,500;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#22355A;
    --cream:#FDF8EF;
    --paper:#FFFFFF;
    --pink:#FFA9DD;
    --orange:#FEB700;
    --yellow:#FFE26F;
    --lime:#C4E02F;
    --sky:#7CD5D9;
    --peri:#99ADFF;
    --shadow:0 8px 0 rgba(34,53,90,.12);
    --radius:24px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:"Nunito",ui-rounded,"Segoe UI Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;
    font-weight:600;
    -webkit-font-smoothing:antialiased;
    padding:0 16px 90px;
  }
  .wrap{max-width:960px;margin:0 auto}

  /* ---------- cabeçalho ---------- */
  header.hero{padding:20px 0 6px;text-align:center}
  .logo{width:230px;max-width:56vw;display:block;margin:0 auto}

  /* ---------- separadores ---------- */
  nav.tabs{display:flex;gap:8px;justify-content:center;margin:14px 0 20px;flex-wrap:wrap}
  .tab{
    font-family:"Baloo 2",cursive;font-size:17px;
    background:var(--paper);color:var(--ink);
    border:4px solid var(--ink);border-radius:999px;
    padding:8px 20px;cursor:pointer;box-shadow:0 5px 0 rgba(34,53,90,.14);
  }
  .tab[aria-selected="true"]{background:var(--orange)}
  .tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{
    outline:4px solid var(--peri);outline-offset:3px
  }

  /* ---------- botões genéricos ---------- */
  .btn-cta{
    font-family:"Baloo 2",cursive;font-size:18px;cursor:pointer;
    background:var(--orange);color:var(--ink);border:4px solid var(--ink);border-radius:999px;
    padding:11px 22px;box-shadow:0 5px 0 rgba(34,53,90,.2);white-space:nowrap;
  }
  .btn-cta:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(34,53,90,.2)}
  .btn-cta.full{width:100%}
  .back-btn{
    font-family:"Baloo 2",cursive;font-size:16px;cursor:pointer;background:var(--paper);
    color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:7px 16px;margin-bottom:12px;
  }
  .back-btn:hover{background:var(--peri)}

  /* ---------- ecrãs / cartões ---------- */
  .card{background:var(--paper);border:4px solid var(--ink);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  h2{font-family:"Baloo 2",cursive;font-size:24px;margin:0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .full{grid-column:1/-1}
  label{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#5B6C8C;margin:0 0 5px}
  input,select,textarea{
    width:100%;font-family:inherit;font-weight:700;font-size:16px;color:var(--ink);
    background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:11px 13px;
  }
  textarea{min-height:78px;resize:vertical}
  select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%2322355A'><path d='M5 8l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 10px center;background-size:20px;padding-right:36px}
  @media (max-width:560px){.grid{grid-template-columns:1fr}}

  /* ---------- grelha de idades ---------- */
  .age-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
  .age-tile{
    grid-column:span 1;
    border:4px solid var(--ink);border-radius:20px;padding:16px 10px;text-align:center;cursor:pointer;
    background:var(--tone,var(--sky));box-shadow:0 6px 0 rgba(34,53,90,.16);
  }
  .age-tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(34,53,90,.16)}
  .age-tile.all{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:16px 20px}
  .age-tile .num{display:block;font-family:"Baloo 2",cursive;font-size:26px;line-height:1}
  .age-tile .lbl{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
  .age-tile .cnt{display:inline-block;margin-top:6px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:800}

  /* ---------- filtros de categoria ---------- */
  .filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .chip{
    font-family:"Baloo 2",cursive;font-size:15px;cursor:pointer;
    background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;color:var(--ink);
  }
  .chip[aria-pressed="true"]{background:var(--tone,var(--ink));color:var(--ink)}
  .chip.all[aria-pressed="true"]{background:var(--ink);color:var(--cream)}

  /* ---------- cartões de atividade ---------- */
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:4px}
  .item{
    background:var(--paper);border:4px solid var(--ink);border-radius:22px;padding:14px 14px 12px;
    box-shadow:0 6px 0 rgba(34,53,90,.12);position:relative;overflow:hidden;
  }
  .item::before{content:"";position:absolute;inset:0 auto 0 0;width:11px;background:var(--tone,var(--sky))}
  .item .body{padding-left:8px}
  .item h3{font-family:"Baloo 2",cursive;font-size:20px;margin:0 0 4px;line-height:1.15;padding-right:26px}
  .item p{margin:0 0 9px;font-size:15px;font-weight:600;color:#3d4f70;line-height:1.4}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .pill{font-size:12.5px;font-weight:800;border-radius:999px;padding:4px 10px;border:2.5px solid var(--ink);background:var(--tone,var(--sky));color:var(--ink)}
  .pill.plain{background:var(--cream)}
  .go{
    display:inline-block;margin-top:10px;font-family:"Baloo 2",cursive;font-size:16px;
    color:var(--ink);text-decoration:none;background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:5px 14px;
  }
  .go:hover{background:var(--orange)}
  .del{
    position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:50%;
    border:3px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;
    font-size:14px;font-weight:800;line-height:1;display:grid;place-items:center
  }
  .del:hover{background:var(--pink)}

  .empty-note{background:var(--paper);border:4px dashed var(--ink);border-radius:22px;padding:26px 18px;text-align:center;color:#5B6C8C;font-weight:700}
  .empty-note strong{display:block;font-family:"Baloo 2",cursive;font-size:20px;color:var(--ink);margin-bottom:4px}
  .hidden{display:none !important}

  /* ---------- calendário ---------- */
  .calbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .calbar h2{text-transform:capitalize}
  .arrow{width:42px;height:42px;border-radius:50%;border:4px solid var(--ink);background:var(--paper);cursor:pointer;font-size:19px;font-weight:800;color:var(--ink);box-shadow:0 4px 0 rgba(34,53,90,.14)}
  .arrow:hover{background:var(--peri)}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .dow{text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#5B6C8C;padding-bottom:2px}
  .day{
    aspect-ratio:1/1;background:var(--cream);border:3px solid transparent;border-radius:16px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:15px;color:var(--ink);
  }
  .day.empty{background:transparent;cursor:default}
  .day.has{background:var(--paper);border-color:var(--ink)}
  .day.today{box-shadow:inset 0 0 0 3px var(--orange)}
  .day[aria-pressed="true"]{background:var(--orange);border-color:var(--ink)}
  .dots{display:flex;gap:3px;height:8px}
  .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink)}
  .dayview{margin-top:16px;border-top:3px dashed #E6DCC8;padding-top:14px}

  .boot-error{display:none;background:var(--pink);color:var(--ink);font-weight:800;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;margin:16px 0;text-align:center}
  footer{text-align:center;color:#5B6C8C;font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin:26px 0 10px}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

        <h2 style="margin-bottom:14px">Nova atividade</h2>
        <div class="grid">
          <div class="full">
            <label for="a-title">Título</label>
            <input id="a-title" placeholder="Caça ao tesouro no museu">
          </div>
          <div class="full">
            <label for="a-desc">Descrição</label>
            <textarea id="a-desc" placeholder="O que vamos fazer, o que levar, quanto tempo demora…"></textarea>
          </div>
          <div>
            <label for="a-cat">Categoria</label>
            <select id="a-cat"></select>
          </div>
          <div>
            <label for="a-age">Idade</label>
            <select id="a-age"></select>
          </div>
          <div>
            <label for="a-date">Data</label>
            <input id="a-date" type="date">
          </div>
          <div>
            <label for="a-link">Link</label>
            <input id="a-link" type="url" placeholder="https://…">
          </div>
          <div class="full" style="text-align:right">
            <button class="btn-cta" id="a-save">Guardar atividade</button>
          </div>
        </div>
      </div>
    </div>

  </section>

  <!-- ======== CALENDÁRIO ======== -->
  <section id="view-cal" role="tabpanel" aria-labelledby="tab-cal" class="hidden">
    <div class="card">
      <div class="calbar">
        <button class="arrow" id="cal-prev" aria-label="Mês anterior">‹</button>
        <h2 id="cal-title" style="justify-content:center"></h2>
        <button class="arrow" id="cal-next" aria-label="Mês seguinte">›</button>
      </div>
      <div class="cal" id="cal-grid"></div>
      <div class="dayview" id="cal-day"></div>
    </div>
  </section>

  <!-- ======== COMPRAS ======== -->
  <section id="view-shop" role="tabpanel" aria-labelledby="tab-shop" class="hidden">

    <!-- ecrã 1: grelha de idades -->
    <div id="shop-home">
      <div class="section-head">
        <h2>Compras por idade</h2>
        <button class="btn-cta" id="go-sadd-home">Nova compra</button>
      </div>
      <div class="age-grid" id="shop-age-grid"></div>
    </div>

    <!-- ecrã 2: compras de uma idade -->
    <div id="shop-age" class="hidden">
      <button class="back-btn" id="shop-age-back">‹ Voltar às idades</button>
      <div class="section-head">
        <h2 id="shop-age-title"></h2>
        <button class="btn-cta" id="go-sadd-age">Nova compra</button>
      </div>
      <div class="filters" id="shop-age-cat-filter"></div>
      <div id="shop-age-items"></div>
    </div>

    <!-- ecrã 3: nova compra -->
    <div id="shop-add" class="hidden">
      <button class="back-btn" id="sadd-back">‹ Voltar</button>
      <div class="card">
        <h2 style="margin-bottom:14px">Nova compra</h2>
        <div class="grid">
          <div class="full">
            <label for="s-title">Título</label>
            <input id="s-title" placeholder="Botas de chuva">
          </div>
          <div class="full">
            <label for="s-desc">Descrição</label>
            <textarea id="s-desc" placeholder="Tamanho, cor, onde comprar…"></textarea>
          </div>
          <div>
            <label for="s-cat">Categoria</label>
            <select id="s-cat"></select>
          </div>
          <div>
            <label for="s-age">Idade</label>
            <select id="s-age"></select>
          </div>
          <div class="full">
            <label for="s-link">Link</label>
            <input id="s-link" type="url" placeholder="https://…">
          </div>
          <div class="full" style="text-align:right">
            <button class="btn-cta" id="s-save">Guardar compra</button>
          </div>
        </div>
      </div>
    </div>

  </section>

  <footer>Play · Learn · Grow</footer>
</div>

<script>
/* ---------------- proteção contra ecrã em branco ---------------- */
window.addEventListener("error", e=>{
  const bar = document.getElementById("boot-error");
  if(bar){ bar.style.display="block"; bar.textContent = "Ups! Algo correu mal: " + (e.message||e); }
});

/* ---------------- categorias / idades ---------------- */
const CATS = [
  {id:"museus", label:"Museus",  tone:"var(--sky)"},
  {id:"teatro", label:"Teatro",  tone:"var(--pink)"},
  {id:"fora",   label:"Lá fora", tone:"var(--lime)"},
  {id:"viagem", label:"Viagem",  tone:"var(--peri)"},
  {id:"casa",   label:"Em casa", tone:"var(--yellow)"}
];
const AGES = Array.from({length:16}, (_,i)=>String(i+3)); // 3..18
const AGE_TONES = ["var(--pink)","var(--orange)","var(--yellow)","var(--lime)","var(--sky)","var(--peri)"];
const ageLabel = a => a==="todas" ? "Todas as idades" : a+" anos";
const ageTone = a => a==="todas" ? "var(--peri)" : AGE_TONES[Number(a)%AGE_TONES.length];
const cat = id => CATS.find(c=>c.id===id) || CATS[0];
const MONTHS = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DOW = ["S","T","Q","Q","S","S","D"];

/* ---------------- dados guardados dentro do dispositivo ---------------- */
let data = {activities:[], shopping:[]};
const STORAGE_KEY = "kittyquest:v2";

function persist(){
  if(window.storage && window.storage.set){
    window.storage.set(STORAGE_KEY, JSON.stringify(data)).catch(()=>{});
  }
}
function restore(){
  if(!(window.storage && window.storage.get)) return;
  window.storage.get(STORAGE_KEY).then(r=>{
    if(r && r.value){
      try{
        const p = JSON.parse(r.value);
        data.activities = Array.isArray(p.activities) ? p.activities : [];
        data.shopping = Array.isArray(p.shopping) ? p.shopping : [];
        renderAll();
      }catch(e){}
    }
  }).catch(()=>{});
}

/* ---------------- utilitários ---------------- */
const $ = s => document.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2));
const esc = s => String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function prettyDate(s){
  if(!s) return null;
  const [y,m,d] = s.split("-").map(Number);
  return `${d} ${MONTHS[m-1].slice(0,3)} ${y}`;
}
function safeUrl(u){
  if(!u) return null;
  const t = u.trim();
  if(/^https?:\/\//i.test(t)) return t;
  if(/^[\w.-]+\.[a-z]{2,}/i.test(t)) return "https://"+t;
  return null;
}

/* ---------------- selects do formulário ---------------- */
function fillSelects(){
  const catOpts = CATS.map(c=>`<option value="${c.id}">${c.label}</option>`).join("");
  const ageOpts = [`<option value="todas">Todas as idades</option>`, ...AGES.map(a=>`<option value="${a}">${a} anos</option>`)].join("");
  $("#a-cat").innerHTML = catOpts; $("#s-cat").innerHTML = catOpts;
  $("#a-age").innerHTML = ageOpts; $("#s-age").innerHTML = ageOpts;
}

/* ---------------- navegação do separador Atividades ---------------- */
let currentAge = null;
let currentAgeCat = "all";
let addOrigin = "home";

function showActScreen(name){
  $("#act-home").classList.toggle("hidden", name!=="home");
  $("#act-age").classList.toggle("hidden", name!=="age");
  $("#act-add").classList.toggle("hidden", name!=="add");
}

$("#go-add-home").onclick = () => { addOrigin="home"; $("#a-age").value = "todas"; showActScreen("add"); };
$("#go-add-age").onclick  = () => { addOrigin="age"; $("#a-age").value = currentAge; showActScreen("add"); };
$("#add-back").onclick    = () => showActScreen(addOrigin==="age" ? "age" : "home");
$("#age-back").onclick    = () => { currentAge=null; showActScreen("home"); };

/* ---------------- ecrã 1: grelha de idades ---------------- */
function renderAgeGrid(){
  const box = $("#age-grid");
  const countFor = a => data.activities.filter(x=>x.age===a).length;
  let html = `<div class="age-tile all" style="--tone:var(--peri)" data-age="todas">
      <span><span class="num">Todas as idades</span><span class="cnt">${countFor("todas")} atividades</span></span>
    </div>`;
  html += AGES.map(a=>`<div class="age-tile" style="--tone:${ageTone(a)}" data-age="${a}">
      <span class="num">${a}</span><span class="lbl">anos</span><span class="cnt">${countFor(a)}</span>
    </div>`).join("");
  box.innerHTML = html;
  box.onclick = e => {
    const t = e.target.closest(".age-tile"); if(!t) return;
    currentAge = t.dataset.age; currentAgeCat = "all";
    renderAgeDetail();
    showActScreen("age");
  };
}

/* ---------------- ecrã 2: atividades de uma idade ---------------- */
function renderAgeDetail(){
  if(currentAge===null) return;
  $("#age-title").textContent = ageLabel(currentAge);

  const filterBox = $("#age-cat-filter");
  filterBox.innerHTML = [`<button class="chip all" data-cat="all" aria-pressed="${currentAgeCat==="all"}">Tudo</button>`,
    ...CATS.map(c=>`<button class="chip" style="--tone:${c.tone}" data-cat="${c.id}" aria-pressed="${currentAgeCat===c.id}">${c.label}</button>`)
  ].join("");
  filterBox.onclick = e => {
    const b = e.target.closest(".chip"); if(!b) return;
    currentAgeCat = b.dataset.cat;
    renderAgeDetail();
  };

  const list = data.activities
    .filter(a=>a.age===currentAge)
    .filter(a=>currentAgeCat==="all" || a.category===currentAgeCat)
    .sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));

  const itemsBox = $("#age-items");
  itemsBox.innerHTML = list.length
    ? `<div class="items">${list.map(i=>itemCard(i,"activities")).join("")}</div>`
    : `<div class="empty-note"><strong>Ainda não há atividades aqui</strong>Usa o botão "Nova atividade" para começar.</div>`;
}

/* ---------------- cartão de atividade / compra ---------------- */
function itemCard(it, kind){
  const c = cat(it.category);
  const url = safeUrl(it.link);
  const date = prettyDate(it.date);
  return `<article class="item" style="--tone:${c.tone}">
    <button class="del" data-del="${it.id}" data-kind="${kind}" aria-label="Apagar ${esc(it.title)}">×</button>
    <div class="body">
      <h3>${esc(it.title)}</h3>
      ${it.desc?`<p>${esc(it.desc)}</p>`:""}
      <div class="meta">
        <span class="pill">${c.label}</span>
        <span class="pill plain">${it.age==="todas"?"Todas as idades":it.age+" anos"}</span>
        ${date?`<span class="pill plain">${date}</span>`:""}
      </div>
      ${url?`<a class="go" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Abrir site</a>`:""}
    </div>
  </article>`;
}

/* ---------------- navegação do separador Compras ---------------- */
let currentShopAge = null;
let currentShopAgeCat = "all";
let shopAddOrigin = "home";

function showShopScreen(name){
  $("#shop-home").classList.toggle("hidden", name!=="home");
  $("#shop-age").classList.toggle("hidden", name!=="age");
  $("#shop-add").classList.toggle("hidden", name!=="add");
}

$("#go-sadd-home").onclick = () => { shopAddOrigin="home"; $("#s-age").value = "todas"; showShopScreen("add"); };
$("#go-sadd-age").onclick  = () => { shopAddOrigin="age"; $("#s-age").value = currentShopAge; showShopScreen("add"); };
$("#sadd-back").onclick    = () => showShopScreen(shopAddOrigin==="age" ? "age" : "home");
$("#shop-age-back").onclick= () => { currentShopAge=null; showShopScreen("home"); };

/* ---------------- ecrã 1: grelha de idades (compras) ---------------- */
function renderShopAgeGrid(){
  const box = $("#shop-age-grid");
  const countFor = a => data.shopping.filter(x=>x.age===a).length;
  let html = `<div class="age-tile all" style="--tone:var(--peri)" data-age="todas">
      <span><span class="num">Todas as idades</span><span class="cnt">${countFor("todas")} compras</span></span>
    </div>`;
  html += AGES.map(a=>`<div class="age-tile" style="--tone:${ageTone(a)}" data-age="${a}">
      <span class="num">${a}</span><span class="lbl">anos</span><span class="cnt">${countFor(a)}</span>
    </div>`).join("");
  box.innerHTML = html;
  box.onclick = e => {
    const t = e.target.closest(".age-tile"); if(!t) return;
    currentShopAge = t.dataset.age; currentShopAgeCat = "all";
    renderShopAgeDetail();
    showShopScreen("age");
  };
}

/* ---------------- ecrã 2: compras de uma idade ---------------- */
function renderShopAgeDetail(){
  if(currentShopAge===null) return;
  $("#shop-age-title").textContent = ageLabel(currentShopAge);

  const filterBox = $("#shop-age-cat-filter");
  filterBox.innerHTML = [`<button class="chip all" data-cat="all" aria-pressed="${currentShopAgeCat==="all"}">Tudo</button>`,
    ...CATS.map(c=>`<button class="chip" style="--tone:${c.tone}" data-cat="${c.id}" aria-pressed="${currentShopAgeCat===c.id}">${c.label}</button>`)
  ].join("");
  filterBox.onclick = e => {
    const b = e.target.closest(".chip"); if(!b) return;
    currentShopAgeCat = b.dataset.cat;
    renderShopAgeDetail();
  };

  const list = data.shopping
    .filter(s=>s.age===currentShopAge)
    .filter(s=>currentShopAgeCat==="all" || s.category===currentShopAgeCat);

  const itemsBox = $("#shop-age-items");
  itemsBox.innerHTML = list.length
    ? `<div class="items">${list.map(i=>itemCard(i,"shopping")).join("")}</div>`
    : `<div class="empty-note"><strong>Ainda não há compras aqui</strong>Usa o botão "Nova compra" para começar.</div>`;
}

function renderShopping(){
  renderShopAgeGrid();
  if(currentShopAge!==null) renderShopAgeDetail();
}

/* ---------------- calendário ---------------- */
let calRef = new Date(); calRef.setDate(1);
let selectedDay = null;

function renderCalendar(){
  const y = calRef.getFullYear(), m = calRef.getMonth();
  $("#cal-title").textContent = `${MONTHS[m]} ${y}`;
  const first = new Date(y,m,1);
  const startPad = (first.getDay()+6)%7;
  const days = new Date(y,m+1,0).getDate();
  const todayIso = iso(new Date());

  let html = DOW.map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<startPad;i++) html += `<div class="day empty"></div>`;
  for(let d=1;d<=days;d++){
    const key = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const hits = data.activities.filter(a=>a.date===key);
    const dots = hits.slice(0,3).map(h=>`<span class="dot" style="background:${cat(h.category).tone}"></span>`).join("");
    html += `<button class="day ${hits.length?"has":""} ${key===todayIso?"today":""}"
      data-day="${key}" aria-pressed="${selectedDay===key}">
      <span>${d}</span><span class="dots">${dots}</span></button>`;
  }
  $("#cal-grid").innerHTML = html;
  $("#cal-grid").onclick = e => {
    const b = e.target.closest(".day[data-day]"); if(!b) return;
    selectedDay = selectedDay===b.dataset.day ? null : b.dataset.day;
    renderCalendar();
  };
  renderDayView();
}
function renderDayView(){
  const box = $("#cal-day");
  if(!selectedDay){
    const upcoming = data.activities.filter(a=>a.date && a.date>=iso(new Date()))
      .sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
    box.innerHTML = `<p style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5B6C8C">A seguir</p>` + (upcoming.length
      ? `<div class="items">${upcoming.map(i=>itemCard(i,"activities")).join("")}</div>`
      : `<div class="empty-note"><strong>Nenhuma data marcada</strong>Escolhe um dia no calendário ou marca uma data numa atividade.</div>`);
    return;
  }
  const hits = data.activities.filter(a=>a.date===selectedDay);
  box.innerHTML = `<p style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5B6C8C">${prettyDate(selectedDay)}</p>` + (hits.length
    ? `<div class="items">${hits.map(i=>itemCard(i,"activities")).join("")}</div>`
    : `<div class="empty-note"><strong>Dia livre</strong>Sem atividades marcadas para este dia.</div>`);
}

/* ---------------- separadores principais ---------------- */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", String(x===t)));
  ["act","cal","shop"].forEach(v=>$("#view-"+v).classList.toggle("hidden", v!==t.dataset.view));
  if(t.dataset.view==="act"){ currentAge=null; showActScreen("home"); renderAgeGrid(); }
  if(t.dataset.view==="cal") renderCalendar();
  if(t.dataset.view==="shop"){ currentShopAge=null; showShopScreen("home"); renderShopAgeGrid(); }
});

/* ---------------- guardar nova atividade ---------------- */
$("#a-save").onclick = () => {
  const title = $("#a-title").value.trim();
  if(!title){ $("#a-title").focus(); $("#a-title").style.borderColor="var(--pink)"; return; }
  $("#a-title").style.borderColor="var(--ink)";
  data.activities.push({
    id:uid(), title, desc:$("#a-desc").value.trim(),
    category:$("#a-cat").value, age:$("#a-age").value,
    date:$("#a-date").value || "", link:$("#a-link").value.trim()
  });
  ["#a-title","#a-desc","#a-link","#a-date"].forEach(s=>$(s).value="");
  persist();
  renderAgeGrid();
  if(addOrigin==="age"){ renderAgeDetail(); showActScreen("age"); }
  else showActScreen("home");
};

/* ---------------- guardar nova compra ---------------- */
$("#s-save").onclick = () => {
  const title = $("#s-title").value.trim();
  if(!title){ $("#s-title").focus(); $("#s-title").style.borderColor="var(--pink)"; return; }
  $("#s-title").style.borderColor="var(--ink)";
  data.shopping.push({
    id:uid(), title, desc:$("#s-desc").value.trim(),
    category:$("#s-cat").value, age:$("#s-age").value, link:$("#s-link").value.trim()
  });
  ["#s-title","#s-desc","#s-link"].forEach(s=>$(s).value="");
  persist();
  renderShopAgeGrid();
  if(shopAddOrigin==="age"){ renderShopAgeDetail(); showShopScreen("age"); }
  else showShopScreen("home");
};

/* ---------------- apagar ---------------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-del]"); if(!b) return;
  const kind = b.dataset.kind;
  data[kind] = data[kind].filter(i=>i.id!==b.dataset.del);
  persist();
  renderAgeGrid();
  if(currentAge!==null) renderAgeDetail();
  renderShopping();
  renderCalendar();
});

$("#cal-prev").onclick = () => { calRef.setMonth(calRef.getMonth()-1); renderCalendar(); };
$("#cal-next").onclick = () => { calRef.setMonth(calRef.getMonth()+1); renderCalendar(); };

/* ---------------- arranque ---------------- */
function renderAll(){
  renderAgeGrid();
  if(currentAge!==null) renderAgeDetail();
  renderShopping();
  renderCalendar();
}

fillSelects();
renderAll();     // pinta já a app com o que existir em memória, nunca fica em branco
restore();        // depois tenta trazer os dados guardados neste dispositivo
</script>
</body>
</html>
